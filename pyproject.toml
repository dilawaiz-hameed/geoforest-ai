[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoforest"
version = "0.1.0"
description = "Individual tree detection and counting from satellite imagery"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/geoforest", "api"]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "api", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends/File defaults are called in the signature by design
    "RUF001", # en dashes and × in interface strings are deliberate typography
]

[tool.ruff.lint.isort]
known-first-party = ["api", "app", "geoforest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
