name: CI

# Every pull request and every push to a long-lived branch. Feature
# branches are validated through their PR, which is where review happens.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install ruff==0.16.8

      - name: Check style
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml \
                 --junitxml=junit.xml

      # The core module is the counting logic. If coverage of it drops, a
      # path through tiling or de-duplication has stopped being exercised.
      - name: Enforce coverage floor on the core module
        run: |
          pip install coverage
          coverage report --include="src/geoforest/*" --fail-under=90

      # The README quotes these numbers. If the count stops being invariant
      # to overlap, the script exits non-zero and the claim fails with it.
      - name: Reproduce the de-duplication table
        run: python scripts/dedup_table.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 14

  docker:
    name: Image builds and serves
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built without the model layer: this job proves the deployable
      # artifact starts and answers, which is what CD depends on.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: geoforest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name geoforest -p 7860:7860 -p 8000:8000 \
            -e API_PORT=8000 geoforest:ci

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API never became ready" >&2
          docker logs geoforest
          exit 1

      - name: Smoke-test an end-to-end detection
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          import numpy as np, requests
          from PIL import Image
          Image.fromarray(
              np.random.default_rng(0).integers(0, 255, (600, 800, 3), dtype=np.uint8)
          ).save("scene.png")
          with open("scene.png", "rb") as handle:
              body = requests.post(
                  "http://127.0.0.1:8000/detect",
                  files={"file": ("scene.png", handle, "image/png")},
                  timeout=120,
              ).json()
          assert body["count"] == len(body["detections"]), body
          assert body["count"] + body["duplicates_removed"] == body["raw_count"], body
          print("detected", body["count"], "via", body["detector_name"])
          PY

      - name: Check the interface is served
        run: curl -fsS http://127.0.0.1:7860/_stcore/health

      - name: Container logs
        if: always()
        run: docker logs geoforest

      - name: Stop container
        if: always()
        run: docker rm -f geoforest
