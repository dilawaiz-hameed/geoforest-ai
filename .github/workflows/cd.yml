name: CD

# Deployment is a consequence of merging to main, never a manual step.
# main is protected, so the only way here is a reviewed PR with CI green.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SERVICE_URL }}
    steps:
      - name: Check the deployment is configured
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          missing=0
          [ -n "$HOOK" ] || { echo "::error::secret RENDER_DEPLOY_HOOK is not set"; missing=1; }
          [ -n "$SERVICE_URL" ] || { echo "::error::variable SERVICE_URL is not set"; missing=1; }
          exit $missing

      - name: Trigger the deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" -o /dev/null

      # A triggered deploy is not a working one. Render's free tier replaces
      # the instance rather than draining it, so the service goes down and
      # then comes back: poll until it serves again, and fail if it never does.
      - name: Wait for the service to come back up
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          echo "Build and boot take a few minutes; polling ${SERVICE_URL}"
          sleep 60
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" \
                   "${SERVICE_URL}/_stcore/health" || true)
            if [ "$code" = "200" ]; then
              echo "Service is live after $((60 + i * 10))s."
              exit 0
            fi
            echo "  attempt ${i}: HTTP ${code}"
            sleep 10
          done
          echo "::error::Service did not become healthy within 15 minutes."
          exit 1

      - name: Record the deployment
        if: always()
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Status | ${{ job.status }} |"
            echo "| URL | ${SERVICE_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
